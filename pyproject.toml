[project]
name = "f1"
version = "0.1.0"
description = "Biblioteca para consulta de dados históricos da OpenF1"
authors = [
    {name = "cabralparisotto", email = "cabral.parisotto@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["streamlit (>=1.40,<2.0)"]

[tool.poetry]
packages = [{include = "f1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.11,<1.0)",
    "pytest (>=8.0,<9.0)",
    "pytest-cov (>=6.0,<7.0)",
    "mkdocs (>=1.6,<2.0)",
    "mkdocs-material (>=9.5,<10.0)",
    "taskipy (>=1.14,<2.0) ; python_version >= \"3.12\" and python_version < \"4.0\"",
]

[tool.taskipy.tasks]
test = "pytest --cov=f1 --cov-report=term-missing --cov-fail-under=50"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
docs = "mkdocs serve --strict --open"
docs-build = "mkdocs build --strict"
dashboard = "streamlit run src/f1/dashboard.py"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".git", ".venv", "build", "dist", "htmlcov", "site"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "ASYNC",
    "S",
    "PT",
    "D",
    "RUF",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["f1"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.coverage.run]
source = ["f1"]
branch = true
relative_files = true
omit = ["*/__pycache__/*", "*/generated/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
precision = 1
